<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>Encuesta de distribución</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1f2437;--mu:#6d7390;--ink:#1f2437;--ac:#4f5bd5;--tt:#eceefe;--hi:#ff8a6b;--t1:#eceefe;--t2:#ffe6de;--t3:#d9ddfb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171a2b;--card:#222640;--tx:#eef0ff;--mu:#a7accb}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Segoe UI",sans-serif}
.w{max-width:1180px;margin:auto;padding:20px 16px 40px}h1{margin:0;font-size:24px}.mu{color:var(--mu);margin:4px 0 12px}
.pg2{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.pg2 i{flex:1;min-width:30px;height:6px;border-radius:9px;background:#c9cdea}.pg2 i.on{background:var(--ac)}.pg2 i.dn{background:var(--hi)}
.fr{background:var(--card);border-radius:18px;margin:16px 0;border:2px solid transparent;box-shadow:0 8px 28px #1f243714;overflow:hidden}.fr.sel{border-color:var(--ac)}
.bar{display:flex;align-items:center;gap:6px;padding:10px 14px;font-weight:700}.bar i{width:10px;height:10px;border-radius:50%;background:#c9cdea}.bar span{flex:1;margin-left:8px}
.bar button,.pick{border:0;border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;background:var(--tt);color:#1f2437;transition:.2s}.pick{display:block;width:calc(100% - 28px);margin:10px 14px 14px;padding:12px;background:var(--ac);color:#fff}.fr.sel .pick{background:var(--hi);color:#1f2437}
.vp{height:560px;overflow:auto;border-top:1px solid #1f243714}.vp.big{height:82vh}
nav{display:flex;justify-content:center;gap:10px}nav button{border:0;border-radius:99px;padding:11px 24px;font-weight:700;cursor:pointer;background:var(--card);color:var(--tx)}nav .p{background:var(--ac);color:#fff}nav button:disabled{opacity:.4}
.res{background:var(--card);border-radius:18px;padding:22px}.res p{display:flex;justify-content:space-between;margin:8px 0;border-bottom:1px dashed #8a90b855;padding-bottom:6px}
/* PAGINA (igual en ambas opciones) */
.pg{background:#fff;color:var(--ink);font-size:13px}.an{background:var(--ink);color:#fff;text-align:center;padding:6px;font-size:12px}
.hd{display:flex;gap:16px;align-items:center;padding:12px 24px}.sq{flex:1;border:1px solid #dfe2f3;border-radius:99px;padding:9px 14px;font:inherit;color:var(--ink);background:#fff}.lg{color:var(--ac);font-size:18px}
.mn{display:flex;gap:18px;padding:0 24px 10px;color:#5b627c;overflow:auto;white-space:nowrap;border-bottom:1px solid #eef0fa}.in{padding:6px 24px 28px}
h3{margin:18px 0 10px;font-size:15px}h2{margin:0 0 6px}
.hero{background:linear-gradient(120deg,var(--ac),#7f89ea);color:#fff;border-radius:18px;padding:22px;display:flex;justify-content:space-between;align-items:center;margin-top:14px}.big2{font-size:60px}
.grid{display:grid;grid-template-columns:repeat(var(--c),1fr);gap:var(--g)}.two{display:grid;gap:16px;grid-template-columns:var(--cl,1fr 1fr)}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.two,.cht{grid-template-columns:1fr!important}}
.pc{cursor:pointer;transition:.2s;min-width:0}.pc:hover{transform:translateY(-3px)}.pc b{display:block;font-weight:600;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pc span{color:var(--ac);font-weight:700}
.im{aspect-ratio:1/1;border-radius:14px;display:grid;place-items:center;font-size:34px;position:relative}.im em{position:absolute;left:6px;top:6px;font-size:10px;font-style:normal;background:var(--hi);color:#1f2437;border-radius:99px;padding:2px 8px;font-weight:700}
.hr{position:absolute;right:6px;top:6px;border:0;background:#ffffffcc;border-radius:50%;width:24px;height:24px;cursor:pointer;color:var(--ink)}.hr.on{color:var(--hi)}
.cat{border-radius:16px;background:var(--t3);display:grid;place-items:center;font-weight:700;transition:.2s;cursor:pointer}.cat:hover{background:var(--t2)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid #d3d7f0;background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--ink);transition:.2s;text-transform:capitalize}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:8px;transition:.2s}.btn.dk{background:var(--ink);width:auto}.btn.lt{background:var(--tt);color:var(--ink)}.btn:hover{filter:brightness(1.1)}
.box{background:#fff;border:1px solid #e3e6f6;border-radius:16px;padding:14px;margin-top:12px}.prf{border:1px solid #e3e6f6;border-radius:16px;padding:12px}.prf .m{background:var(--t1);border-radius:12px;display:grid;place-items:center;margin-top:8px;font-size:26px}
.app{background:var(--ink);color:#fff;border-radius:16px;padding:18px;margin-top:20px}
.gal .mn2{background:var(--t2);border-radius:16px;display:grid;place-items:center;font-size:90px}.gal .th{display:flex;gap:8px;margin-top:8px}.gal .th i{width:50px;height:50px;border-radius:10px;background:var(--t3);display:grid;place-items:center;font-style:normal}
.pr{font-size:22px;color:var(--ac);display:block;margin:6px 0}.ok{color:#2f8a5f;font-weight:700;display:block;margin-top:6px}
.step{display:flex;gap:8px;align-items:center;padding:4px 0;color:#8a90b0}.step i{width:20px;height:20px;border-radius:50%;background:var(--tt);display:grid;place-items:center;font-style:normal;font-size:11px}.step.d{color:var(--ink)}.step.d i{background:var(--ac);color:#fff}.step.c i{background:var(--hi);color:#1f2437}
.it{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eef0fa}.it .im{width:64px;aspect-ratio:1;font-size:26px}.it>div:nth-child(2){flex:1}.qb{display:inline-flex;gap:8px;align-items:center}.qb button{width:26px;height:26px;border-radius:50%;border:1px solid #d3d7f0;background:#fff;cursor:pointer}
.cht{display:grid;gap:12px;min-height:420px}.ml{min-height:200px;max-height:260px;overflow:auto;padding:8px;background:var(--tt);border-radius:14px}.bub{max-width:75%;padding:7px 12px;border-radius:14px;margin:5px 0;background:#fff}.bub.me{background:var(--ac);color:#fff;margin-left:auto}
.ci{flex:1;border:1px solid #d3d7f0;border-radius:99px;padding:9px 14px;font:inherit}.cv{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;cursor:pointer}.cv.on{background:var(--tt)}.cv i{width:34px;height:34px;border-radius:50%;background:var(--t2);display:grid;place-items:center;font-style:normal}
.pt{height:10px;background:var(--tt);border-radius:9px;overflow:hidden;margin:8px 0}.pt span{display:block;height:100%;width:1%;background:var(--ac)}
.tb{border:0;background:#fff;padding:9px 12px;cursor:pointer;text-align:left;border-radius:10px;color:var(--ink);font:inherit;transition:.2s}.tb.on{background:var(--ac);color:#fff}.tbs{display:flex;gap:6px;flex-wrap:wrap}
.kp{border-radius:16px;padding:14px}.kp b{display:block;font-size:22px}.bars{display:flex;align-items:flex-end;gap:8px;height:110px}.bars i{flex:1;border-radius:8px 8px 3px 3px;background:var(--ac);cursor:pointer;transition:.2s}.bars i:hover{background:var(--hi)}.ord{border:1px solid #e3e6f6;border-radius:12px;padding:10px;margin-top:8px;cursor:pointer}.x{display:none;margin-top:6px}.ord.o .x{display:block}
select,.fq,.fp{font:inherit;padding:7px;border-radius:10px;border:1px solid #d3d7f0;color:var(--ink);background:#fff;max-width:100%}details{border-bottom:1px solid #eef0fa;padding:9px 0}summary{cursor:pointer;font-weight:700}.tbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
</style></head><body><div class="w">
<h1>¿Qué distribución prefieres?</h1><p class="mu">Cada sección muestra dos páginas con el mismo estilo y colores; solo cambia cómo están colocados los elementos. Desliza dentro de cada página, interactúa y elige. El orden es aleatorio.</p>
<div class="pg2" id="pg"></div><div id="ab"></div><nav><button id="pv">← Atrás</button><button id="nx" class="p">Siguiente →</button></nav></div>
<script>
const PR=[['👗','Body animal print',25,'moda'],['👟','Zapatillas deportivas',75,'moda'],['🧴','Perfume floral',16,'belleza'],['🎧','Audífonos BT',32,'tech'],['🪴','Maceta cerámica',9,'hogar'],['👖','Bermuda jean',17,'moda'],['💄','Set maquillaje',12,'belleza'],['⌚','Smartwatch',28,'tech'],['📱','Funda celular',6,'tech'],['🕯️','Vela aromática',8,'hogar'],['🧥','Chaqueta',34,'moda'],['🧼','Jabón de colágeno',7,'belleza']];
const BG=['var(--t1)','var(--t2)','var(--t3)'],$=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const card=(p,i)=>`<div class="pc" data-c="${p[3]}"><div class="im" style="background:${BG[i%3]}">${p[0]}<button class="hr" aria-label="Favorito">♡</button>${i%4?'':'<em>Nuevo hoy</em>'}</div><b>${p[1]}</b><span>$${p[2].toFixed(2)}</span></div>`;
const G=(c,g,h)=>`<div class="grid" style="--c:${c};--g:${g}px">${h}</div>`;
const prods=(n,i0=0)=>PR.slice(i0,i0+n).map((p,i)=>card(p,i)).join('');
const head=`<div class="an">🚀 ¡Descarga la app ahora! 🚀</div><div class="hd"><b class="lg">◌ tienda</b><input class="sq" placeholder="Busca aquí" aria-label="Buscar"><span>👤 ♡ 🔔 👜</span></div><div class="mn"><span>Moda y accesorios</span><span>Belleza</span><span>Tecnología</span><span>Hogar</span><span>Automotriz</span><span>Estilo de vida</span><span>Mascotas</span></div>`;
const chips=()=>`<div class="chips">${['todo','moda','belleza','tech','hogar'].map((c,i)=>`<button class="chip${i?'':' on'}" data-f="${c}">${c}</button>`).join('')}</div>`;
const pg=h=>`<div class="pg">${head}<div class="in">${h}</div></div>`;
const tkBox='<div class="box tk" hidden></div>';
const conv=['Vendedor 1','Vendedor 2','Vendedor 3'];
const S=[
{t:'Inicio',f:c=>pg((c?`<div class="hero" style="min-height:230px"><div><h2>Compra segunda mano.<br>Sin complicaciones.</h2><button class="btn dk">Explora ahora</button></div><span class="big2">🛍️</span></div><h3>Categorías destacadas</h3>`+G(4,14,['Lo nuevo','Mujer','Hombre','Tecnología'].map(x=>`<div class="cat" style="height:150px">${x}</div>`).join(''))+`<h3>Explora más productos</h3>`+chips()+G(4,24,prods(12))+`<h3>Perfiles destacados</h3>`+G(2,16,[1,2].map(()=>`<div class="prf"><b>@perfil</b><div class="m" style="height:110px">🌸👟🎧</div></div>`).join(''))+`<div class="app" style="padding:36px"><h3>Vive la mejor experiencia en la App</h3></div>`
:`<div class="hero" style="min-height:70px"><b>Compra segunda mano. Sin complicaciones.</b><button class="btn dk">Explora</button></div>`+G(4,8,['Lo nuevo','Mujer','Hombre','Tecnología'].map(x=>`<div class="cat" style="height:50px;margin-top:12px">${x}</div>`).join(''))+chips()+G(6,10,prods(12))+`<h3>Perfiles destacados</h3>`+G(4,8,[1,2,3,4].map(()=>`<div class="prf"><b>@perfil</b><div class="m" style="height:44px">🌸👟🎧</div></div>`).join(''))+`<div class="app" style="padding:12px"><b>Vive la mejor experiencia en la App</b></div>`))},
{t:'Búsqueda y categorías',f:c=>{const cs=['<input class="fq" placeholder="Buscar producto">', '<select class="fc"><option value="todo">Todas las categorías</option><option value="moda">Moda</option><option value="belleza">Belleza</option><option value="tech">Tecnología</option><option value="hogar">Hogar</option></select>', '<label>Hasta <b class="pv">$80</b> <input class="fp" type="range" min="5" max="80" value="80"></label>', '<select class="fs"><option value="0">Ordenar: relevancia</option><option value="1">Menor precio</option><option value="2">Mayor precio</option></select>'],ct=cs.join('');
return pg(`<h2>Belleza y cuidado personal</h2><p class="cn" style="color:#6d7390"></p>`+(c?`<div class="two" style="--cl:260px 1fr"><aside>${['Búsqueda','Categoría','Precio','Ordenar por'].map((x,n)=>`<details open><summary>${x}</summary><div style="padding:8px 0">${cs[n]}</div></details>`).join('')}</aside><div class="rg"></div></div>`:`<div class="tbar">${ct}</div><div class="rg"></div>`))}},
{t:'Producto y compra',f:c=>{const gal=`<div class="gal"><div class="mn2" style="height:${c?300:210}px">👗</div><div class="th"><i>👗</i><i>🔄</i><i>🧍</i></div></div>`,info=`<div class="box" style="margin-top:0"><h2>Body animal print</h2><p>Talla S · Como nuevo</p><b class="pr">$25.00</b><button class="btn go">Comprar con pago protegido</button><button class="btn lt">Inicia un chat</button><button class="btn lt">Ofertar</button><span class="ok"></span></div>`,sel=`<div class="box">Vendido por <b>@vendedor</b> · ★ 5.0 · Activo hace 21 s</div>`,sim=`<h3>Artículos similares</h3>`+G(4,14,prods(4,2));
return pg(c?`<div class="two" style="margin-top:14px">${gal}<div>${info}${sel}</div></div><div style="height:30px"></div>${sim}<div style="height:30px"></div>${tkBox}`:`<div class="two" style="margin-top:14px;--cl:1fr 1.3fr">${gal}<div>${info}${sel}${tkBox}</div></div>${sim}`)}},
{t:'Carrito',f:c=>{const its=[[0,1],[3,1]].map(([i,q])=>`<div class="it" data-p="${PR[i][2]}"><div class="im" style="background:${BG[i%3]}">${PR[i][0]}</div><div><b>${PR[i][1]}</b><br>$${PR[i][2].toFixed(2)}</div><span class="qb"><button class="qm">−</button><b class="q">${q}</b><button class="qp">+</button></span></div>`).join(''),sm=`<div class="box" style="margin-top:0"><b>Resumen</b><p>Envío: $3.50</p><h2>Total: <span class="tt">$0</span></h2><button class="btn">Ir a pagar</button></div>`,rec=`<h3>Te podría gustar</h3>`+G(c?4:5,c?18:10,prods(c?4:5,5));
return pg(`<h2 style="margin-top:14px">Carrito</h2>`+(c?`<div>${its}</div><div style="height:30px"></div>${sm}<div style="height:30px"></div>${rec}`:`<div class="two" style="--cl:1.8fr 1fr"><div>${its}</div>${sm}</div>${rec}`))}},
{t:'Chat con el vendedor',f:c=>{const list=conv.map((n,i)=>`<div class="cv${i?'':' on'}"><i>🧑</i><div><b>${n}</b><br><small>Activo ahora</small></div></div>`).join(''),pd=`<div class="box" style="margin-top:0"><div class="im" style="background:var(--t2);height:${c?90:50}px;aspect-ratio:auto">👗</div><b>Body animal print</b><br>$25.00<button class="btn">Comprar</button><button class="btn lt">Ofertar</button></div>`,qr=`<div class="chips" style="margin:8px 0">${['¿Sigue disponible?','¿Hacen envío?','Quiero ofertar'].map(x=>`<button class="chip qr">${x}</button>`).join('')}</div>`,inp=`<div style="display:flex;gap:8px"><input class="ci" placeholder="Escribe un mensaje…"><button class="btn cs" style="width:auto;margin:0">➤</button></div>`,ms=`<div class="ml"><div class="bub">¡Hola! ¿En qué te ayudo?</div></div>`;
return pg(c?`<div class="cht" style="grid-template-columns:230px 1fr 190px;margin-top:14px"><div>${list}</div><div>${ms}<div style="height:50px"></div>${inp}${qr}</div><div>${pd}</div></div>`:`<div class="cht" style="margin-top:14px"><div style="display:flex;gap:8px;overflow:auto">${list}</div>${pd.replace('class="box" style="margin-top:0"','class="box" style="margin:0;display:flex;gap:12px;align-items:center"')}<div>${ms}${qr}${inp}</div></div>`)}},
{t:'Perfil, puntos y preferencias',f:c=>{const tabs=['Resumen','Compras','Puntos','Preferencias'],tc={Resumen:'🛍️ 1 compra en camino<br>♡ 5 favoritos<br>🔔 2 notificaciones',Compras:'👗 Body animal print — En camino',Puntos:'Refiere a un amigo +1000<br>Completa una compra +30<br>Entra cada día +20',Preferencias:'Moda · Belleza · Tecnología<br>Tallas: S, M'};
const tb=cl=>tabs.map((x,i)=>`<button class="tb${i?'':' on'}" data-t="${x}">${x}</button>`).join(''),body=`<div class="pt"><span></span></div><small>10 pts · faltan 990 para $1 OFF</small>${tabs.map((x,i)=>`<div class="box tcn" data-t="${x}" ${i?'hidden':''}>${tc[x]}</div>`).join('')}`;
return pg(c?`<div class="two" style="--cl:210px 1fr;margin-top:14px"><div style="display:grid;gap:6px;align-content:start">${tb()}</div><div><h2>Hola, Joseph</h2><div style="height:60px"></div>${body}</div></div>`:`<div class="box" style="margin-top:14px"><h2>Hola, Joseph 👋</h2><div class="tbs">${tb()}</div></div>${body}`)}},
{t:'Panel de vendedor',f:c=>{const kp=[['Ventas','12','var(--t1)'],['Ingresos','$286','var(--t2)'],['Visitas','1.4k','var(--t3)']].map(k=>`<div class="kp" style="background:${k[2]}">${k[0]}<b>${k[1]}</b></div>`).join(''),ch=`<div class="box" style="margin-top:0"><b>Ventas últimos 7 días</b> <span class="bv" style="color:var(--ac)"></span><div class="bars" style="margin-top:10px">${[2,4,3,6,5,8,7].map(v=>`<i style="height:${v*12}px" data-v="${v}"></i>`).join('')}</div></div>`,od=`<div><b>Pedidos</b>${[['👗 Body animal print','En camino',2],['👟 Zapatillas','Pago en validación',1],['🎧 Audífonos BT','Dinero liberado',4]].map(o=>`<div class="ord"><b>${o[0]}</b> · <span style="color:var(--ac)">${o[1]}</span><div class="x">${['Pago recibido','Preparado','Enviado','Entregado','Dinero liberado'].map((l,i)=>`<div class="step ${i<o[2]?'d':''}"><i>${i<o[2]?'✓':i+1}</i>${l}</div>`).join('')}</div></div>`).join('')}</div>`;
return pg(c?`<h2 style="margin-top:14px">Hola!</h2><div style="display:grid;gap:22px">${kp}</div><div style="height:30px"></div>${ch}<div style="height:30px"></div>${od}`:`<div class="grid" style="--c:3;--g:10px;margin-top:14px">${kp}</div><div class="two" style="margin-top:12px;--cl:1fr 1fr">${ch}${od}</div>`)}}
];
const L=['Pago recibido y protegido','Vendedor prepara el paquete','En camino','Entregado','Pago liberado al vendedor'];
function drawTk(t){const s=+t.dataset.s;t.innerHTML='<b>Seguimiento de tu compra</b>'+L.map((l,i)=>`<div class="step ${i<s?'d':i==s?'c':''}"><i>${i<s?'✓':i+1}</i>${l}</div>`).join('')+(s<L.length?'<button class="btn lt nxs">Simular siguiente etapa</button>':'<span class="ok">🎉 Transacción validada</span>')}
function rs(f){const q=$('.fq',f).value.toLowerCase(),c=$('.fc',f).value,m=+$('.fp',f).value,o=$('.fs',f).value;let r=PR.filter(p=>(c=='todo'||p[3]==c)&&p[2]<=m&&p[1].toLowerCase().includes(q));if(o==1)r.sort((a,b)=>a[2]-b[2]);if(o==2)r.sort((a,b)=>b[2]-a[2]);$$('.pv',f).forEach(e=>e.textContent='$'+m);$('.cn',f).textContent=r.length+' resultados';$('.rg',f).innerHTML=G(f.dataset.c=='1'?3:5,f.dataset.c=='1'?20:10,r.map(card).join(''))}
function tot(f){let s=3.5;$$('.it',f).forEach(i=>s+=i.dataset.p*$('.q',i).textContent);const t=$('.tt',f);if(t)t.textContent='$'+s.toFixed(2)}
function bind(f,k,c){f.dataset.c=c?1:0;
 if($('.rg',f)){$$('.fq,.fc,.fp,.fs',f).forEach(e=>e.oninput=()=>rs(f));rs(f)}tot(f);const pt=$('.pt span',f);if(pt)pt.style.width='1%';
 const send=t=>{if(!t.trim())return;const m=$('.ml',f);m.insertAdjacentHTML('beforeend',`<div class="bub me"></div>`);m.lastChild.textContent=t;$('.ci',f).value='';m.scrollTop=1e5;setTimeout(()=>{m.insertAdjacentHTML('beforeend','<div class="bub">¡Claro! Te respondo enseguida ✨</div>');m.scrollTop=1e5},700)};
 const ci=$('.ci',f);if(ci)ci.onkeydown=e=>e.key=='Enter'&&send(ci.value);
 f.onclick=e=>{const t=e.target,cl=t.classList;
  if(cl.contains('hr')){cl.toggle('on');t.textContent=cl.contains('on')?'♥':'♡'}
  if(t.dataset.f){$$('.chip[data-f]',f).forEach(x=>x.classList.toggle('on',x==t));$$('.pc',f).forEach(p=>p.style.display=t.dataset.f=='todo'||p.dataset.c==t.dataset.f?'':'none')}
  if(cl.contains('go')){const tk=$('.tk',f);tk.hidden=false;tk.dataset.s=0;drawTk(tk);$('.ok',f).textContent='✓ Compra iniciada'}
  if(cl.contains('nxs')){const tk=t.closest('.tk');tk.dataset.s=+tk.dataset.s+1;drawTk(tk)}
  if(cl.contains('qm')||cl.contains('qp')){const q=$('.q',t.parentNode);q.textContent=Math.max(1,+q.textContent+(cl.contains('qp')?1:-1));tot(f)}
  if(cl.contains('cs'))send($('.ci',f).value);if(cl.contains('qr'))send(t.textContent);
  if(t.dataset.t){$$('.tb',f).forEach(x=>x.classList.toggle('on',x==t));$$('.tcn',f).forEach(x=>x.hidden=x.dataset.t!=t.dataset.t);const p=$('.pt span',f);if(p)p.style.width=t.dataset.t=='Puntos'?'12%':'1%'}
  const o=t.closest('.ord');if(o)o.classList.toggle('o');
  if(t.parentNode&&t.parentNode.classList.contains('bars'))$('.bv',f).textContent=t.dataset.v+' ventas';
  if(t.id=='ex'){const v=t.closest('.fr').querySelector('.vp');v.classList.toggle('big');t.textContent=v.classList.contains('big')?'Reducir':'Ampliar'}}}
let k=0;const C={},O=S.map(()=>Math.random()<.5);
function render(){
 if(k>=S.length)return fin();const s=S[k];
 $('#pg').innerHTML=S.map((x,i)=>`<i class="${C[i]?'dn':''} ${i==k?'on':''}" title="${x.t}"></i>`).join('');
 const ord=O[k]?[1,0]:[0,1];
 $('#ab').innerHTML=`<h2>${k+1}/${S.length} · ${s.t}</h2>`+ord.map((v,j)=>`<div class="fr${C[k]===v?' sel':''}"><div class="bar"><i></i><i></i><i></i><span>Opción ${j+1}</span><button id="ex">Ampliar</button></div><div class="vp">${s.f(!v)}</div><button class="pick" data-v="${v}" data-j="${j+1}">${C[k]===v?'✓ Elegida':'Elegir Opción '+(j+1)}</button></div>`).join('');
 $$('.vp').forEach((v,j)=>bind(v,k,!ord[j]));
 $$('.pick').forEach(b=>b.onclick=()=>{C[k]=+b.dataset.v;const y=scrollY;render();scrollTo(0,y)});
 $('#pv').disabled=!k;$('#nx').disabled=C[k]===undefined;$('#nx').textContent=k==S.length-1?'Ver resultados':'Siguiente →'}
function fin(){const n=Object.values(C).filter(v=>v==0).length,m=S.length-n;$('#pg').innerHTML=S.map(()=>'<i class="dn"></i>').join('');
 $('#ab').innerHTML=`<div class="res"><h2>Tus respuestas</h2><p>Distribución A: <b>${n} de ${S.length}</b></p><p>Distribución B: <b>${m} de ${S.length}</b></p>${S.map((s,i)=>`<p><span>${s.t}</span><b>${C[i]?'B':'A'}</b></p>`).join('')}<small class="mu">A = distribución del sitio actual · B = distribución propuesta (se revela solo al final).</small></div>`;$('#nx').style.display='none'}
$('#pv').onclick=()=>{$('#nx').style.display='';k=Math.max(0,k-1);render()};$('#nx').onclick=()=>{k++;render()};render();
</script></body></html>
